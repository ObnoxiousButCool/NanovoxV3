# Tooling configuration for the NanoVox Insights backend.
#
# There is deliberately no [project] table: the backend is run as an application
# from this directory, not installed as a distributable package. Runtime and dev
# dependencies live in requirements.txt / requirements-dev.txt.
#
# Copied from NanoVox-V2's pyproject.toml and renamed, per plan §2A.0: when the
# plan and NanoVox disagree on style, NanoVox wins.

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # flake8-bugbear
    "A",           # flake8-builtins
    "C4",          # flake8-comprehensions
    "DTZ",         # flake8-datetimez
    "T20",         # flake8-print (no stray print/pprint)
    "SIM",         # flake8-simplify
    "PTH",         # flake8-use-pathlib
    "RUF",         # ruff-specific
    "ANN",         # flake8-annotations
    "ASYNC",       # flake8-async
    "S",           # flake8-bandit
    "TID",         # flake8-tidy-imports
    "ERA",         # eradicate (no commented-out code)
    "FIX",         # no TODO/FIXME left behind
]
ignore = [
    "ANN401",      # allow typing.Any where a boundary genuinely needs it
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test
"frameworks_drivers/cli/*" = ["T201"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
show_error_codes = true
pretty = true
files = ["domain", "application", "infrastructure", "frameworks_drivers", "tests"]
exclude = ["infrastructure/persistence/migrations/"]

[[tool.mypy.overrides]]
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
# `-n auto --dist loadfile`: every test builds its own SQLite file and the
# suite shares no state between them, so it parallelises. Serial, 1,600
# tests took about four minutes; across the machine's cores it takes one.
# `loadfile` rather than the default `load` so a file's tests stay on one
# worker -- the session-scoped corpus ingest in tests/integration/conftest.py
# is then built once per worker that needs it rather than once per test that
# happens to land somewhere new.
#
# In addopts rather than on the command line so that CI's bare
# `pytest --cov` and a developer's bare `pytest` are the same run. To debug
# serially, `pytest -n 0` -- and only that: `-p no:xdist` turns the plugin
# off while this line still passes it `-n`, so pytest exits on an
# unrecognised argument rather than running anything.
addopts = "-q --strict-markers --strict-config -n auto --dist loadfile"
filterwarnings = [
    "error",
    "ignore::ResourceWarning",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["domain", "application", "infrastructure", "frameworks_drivers"]
branch = true
omit = ["*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]

# --- Clean Architecture dependency rule (plan §2A.1) -----------------------
# Enforced in CI. The domain layer imports nothing outward; each layer may only
# import from layers listed below it.

[tool.importlinter]
root_packages = ["domain", "application", "infrastructure", "frameworks_drivers"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers point inward"
type = "layers"
layers = [
    "frameworks_drivers",
    "infrastructure",
    "application",
    "domain",
]

[[tool.importlinter.contracts]]
name = "Domain is framework-free"
type = "forbidden"
source_modules = ["domain"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "pydantic",
    "pydantic_settings",
    "httpx",
    "uvicorn",
]

[[tool.importlinter.contracts]]
name = "Application depends on ports, not on frameworks"
type = "forbidden"
source_modules = ["application"]
forbidden_modules = [
    "fastapi",
    "starlette",
    "sqlalchemy",
    "alembic",
    "uvicorn",
]

# --- Answer-key separation (plan §8 Phase 2) -------------------------------
# The answer key (category, archetype, cited rules, outcome, score, the CALL
# TAGS block) exists only to score the pipeline in Phase 5. Two different
# kinds of module must not be able to reach it, structurally rather than by
# convention:
#
# - Extraction, because a leak into an LLM prompt would look exactly like an
#   import here. Add every extraction-stage module (Phase 4's L1-L4).
# - The aggregation layer, because a dashboard figure sourced from the answer
#   key would be reporting the truth we wrote rather than what the pipeline
#   found, and would read as a passing number. Stream B's whole premise is
#   that `CallTags` is a port — whoever holds the facts maps them in — so
#   aggregation has no legitimate reason to name either side.
[[tool.importlinter.contracts]]
name = "Extraction and the dashboard cannot read the answer key"
type = "forbidden"
source_modules = [
    "application.use_cases.ingest_transcripts",
    "infrastructure.corpus.pdf_corpus_source",
    "domain.extraction.l1_deterministic",
    "application.use_cases.classify_call_l2",
    "application.use_cases.classify_call_l3",
    "application.use_cases.classify_call_l4",
    "application.use_cases.run_extraction_pipeline",
    "application.use_cases.run_extraction_over_corpus",
    # Stream B. Not an extraction stage, but subject to the same rule, and
    # for a reason that bites harder: nothing downstream of a figure can tell
    # where its number came from.
    "domain.aggregation",
    # Revised plan Phase 4: the issue-key registry the screens resolve.
    "domain.playbooks",
    "application.use_cases.playbooks",
]
forbidden_modules = [
    "application.ports.answer_key_source",
    "infrastructure.corpus.pdf_answer_key_source",
    "domain.entities.answer_key",
    # The workbook side of the same answer key (plan §8 Phase 2). The PDF
    # entries above cover five fields; the Transcript Tracker carries
    # twenty-four, so these matter more, not less.
    "application.ports.ground_truth_source",
    "application.ports.ground_truth_repository",
    "application.use_cases.import_answer_key",
    "domain.entities.ground_truth",
    "infrastructure.reference.xlsx_ground_truth_source",
    "infrastructure.persistence.repositories.ground_truth_repository",
    # Phase 5's evaluation harness. The comparators themselves hold no
    # answers — they are handed two values — but the package is where the
    # harness that reads both sides will live (E4), and this is the phase
    # that gives an extraction module something new and dangerous to import.
    # Forbidden now, while the list is short and the reason is fresh.
    "domain.evaluation",
    # Phase 5's harness itself (E4). It holds both sides at once — the
    # answers and the pipeline's output — which makes it the single object
    # an extraction module must never be able to reach.
    "application.use_cases.evaluate_extraction",
]

# --- Aggregation reads the schema, not the pipeline (Stream B) -------------
# `domain/aggregation/call_tags.py` states the rule this contract enforces:
# the aggregations are written against the Call Tag Schema's sixteen fields,
# not against Stream A's entities. That is what lets the two streams run in
# parallel, and it is why `CallTags` is "a port in data form" — the pipeline,
# the answer key and a test fixture all map into the same shape.
#
# Forbidding the entity package wholesale, rather than listing entities one
# by one, is deliberate:
#
# - It does not rot. A new entity is out of reach the day it is added, with
#   no one needing to remember this file.
# - It covers the narrow-join rule. `Employer` carries the churn-profile
#   label the corpus was generated from, so an account scored on it would be
#   scored on its own answer. `tests/unit/test_no_circular_scoring.py`
#   catches that label by name; this catches the import that would make it
#   reachable in the first place.
#
# An aggregation that needs a new employer or broker fact adds a field to
# `EmployerFacts` or `BrokerFacts`, which is a visible, reviewable widening
# of the join — not a silent one.
[[tool.importlinter.contracts]]
name = "Aggregation reads the schema, not the pipeline"
type = "forbidden"
source_modules = ["domain.aggregation"]
forbidden_modules = [
    "domain.entities",
    "domain.extraction",
]
